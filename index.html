<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX OR NEW</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }
    .game {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: auto;
      background: linear-gradient(135deg, #171717, #303030);
    }
    .screen {
      width: 100%;
      min-height: 100vh;
      padding: 40px 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .content {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }
    .subtitle {
      font-size: 14px;
      letter-spacing: 4px;
      color: #aaa;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 56px;
      letter-spacing: 6px;
      margin: 0 0 20px;
    }
    h2 {
      font-size: 34px;
      margin: 15px 0 25px;
    }
    h3 {
      font-size: 24px;
      margin-top: 0;
    }
    p {
      line-height: 1.8;
    }
    .description {
      color: #ddd;
      margin-bottom: 35px;
    }
    button {
      border: none;
      border-radius: 30px;
      padding: 14px 35px;
      margin-top: 18px;
      background: white;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      transform: scale(1.04);
    }
    input {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 22px;
      margin: 18px 0;
      text-align: left;
    }
    .card p {
      color: #ddd;
      margin: 8px 0;
    }
    /* =========================
       스토리 화면
       ========================= */
    .story {
      min-height: 100vh;
      padding: 25px;
      padding-top: 65px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
    }
    .day {
      position: absolute;
      top: 20px;
      left: 25px;
      font-size: 17px;
      letter-spacing: 3px;
      z-index: 5;
    }
    .background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .dark-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 1;
    }
    .story-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      margin: auto auto 0;
    }
    .image-box {
      text-align: center;
      margin-bottom: 15px;
      position: relative;
      z-index: 2;
    }
    .scene-image {
      width: 100%;
      max-width: 650px;
      max-height: 55vh;
      object-fit: contain;
      border-radius: 14px;
    }
    .dialogue {
      background: rgba(0,0,0,0.88);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      position: relative;
      z-index: 3;
    }
    .speaker {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .dialogue p {
      margin: 6px 0;
    }
    .next {
      display: block;
      margin-left: auto;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }
      h2 {
        font-size: 29px;
      }
      .scene-image {
        max-height: 45vh;
      }
    }
  </style>
</head>
<body>
<main class="game">
  <div id="app" class="screen">
    <div class="content">
      <div class="subtitle">
        ROMANCE SIMULATION GAME
      </div>
      <h1>EX OR NEW</h1>
      <p class="description">
        다시 시작된 첫사랑, 그리고 새로운 설렘.<br>
        당신의 선택은 누구를 향하게 될까?
      </p>
      <button onclick="startGame()">
        GAME START
      </button>
    </div>
  </div>
</main>
<script>
  let alarmSound = null;
  let phoneRing = null;
  // =========================
  // 게임 시작
  // =========================
  function startGame() {
    document.getElementById("app").innerHTML = `
      <div class="content">
        <div class="subtitle">
          PLAYER INFORMATION
        </div>
        <h2>플레이어 정보</h2>
        <p>
          게임을 시작하기 전에<br>
          당신의 정보를 입력해주세요.
        </p>
        <input
          id="playerName"
          type="text"
          placeholder="이름"
        >
        <input
          id="playerAge"
          type="number"
          placeholder="나이"
        >
        <input
          id="playerBirth"
          type="date"
        >
        <button onclick="savePlayerInfo()">
          확인
        </button>
      </div>
    `;
  }
  // =========================
  // 정보 저장
  // =========================
  function savePlayerInfo() {
    const name =
      document.getElementById("playerName").value.trim();
    const age =
      document.getElementById("playerAge").value;
    const birth =
      document.getElementById("playerBirth").value;
    if (!name || !age || !birth) {
      alert("이름, 나이, 생년월일을 모두 입력해주세요!");
      return;
    }
    localStorage.setItem("playerName", name);
    localStorage.setItem("playerAge", age);
    localStorage.setItem("playerBirth", birth);
    showRules();
  }
  // =========================
  // 게임 규칙
  // =========================
  function showRules() {
    document.getElementById("app").innerHTML = `
      <div class="content">
        <div class="subtitle">
          GAME RULES
        </div>
        <h2>게임 규칙</h2>
        <p>
          이 게임은 선택형 로맨스 시뮬레이션 게임입니다.
        </p>
        <p>
          플레이어의 선택에 따라<br>
          스토리와 결말이 달라집니다.
        </p>
        <p>
          <strong>EX</strong> — 다시 시작된 첫사랑
        </p>
        <p>
          <strong>NEW</strong> — 새롭게 시작되는 설렘
        </p>
        <p>
          어떤 선택을 할지는 당신에게 달려 있습니다.
        </p>
        <button onclick="showCharacters()">
          NEXT
        </button>
      </div>
    `;
  }
  // =========================
  // 등장인물
  // =========================
  function showCharacters() {
    document.getElementById("app").innerHTML = `
      <div class="content">
        <div class="subtitle">
          CHARACTER PROFILE
        </div>
        <h2>등장인물</h2>
        <div class="card">
          <h3>🐱 김준호</h3>
          <p>
            <strong>나이:</strong> 18세
          </p>
          <p>
            <strong>생년월일:</strong> 8월 17일
          </p>
          <p>
            <strong>관계:</strong> 플레이어의 전남자친구
          </p>
          <p>
            <strong>성격:</strong>
            무심하고 차가워 보이지만,
            마음을 준 사람에게는 진심이다.
          </p>
          <p>
            <strong>인상:</strong> 고양이상
          </p>
        </div>
        <div class="card">
          <h3>🐶 한호진</h3>
          <p>
            <strong>나이:</strong> 18세
          </p>
          <p>
            <strong>관계:</strong> 플레이어의 남사친
          </p>
          <p>
            <strong>성격:</strong>
            밝고 다정하며 장난기가 많다.
          </p>
          <p>
            <strong>인상:</strong> 강아지상
          </p>
        </div>
        <p>
          이제 당신의 이야기가 시작됩니다.
        </p>
        <button onclick="startDay1()">
          DAY 1 START
        </button>
      </div>
    `;
  }
  // =========================
  // DAY 1
  // 플레이어 방 + 알람
  // =========================
  function startDay1() {
    document.getElementById("app").innerHTML = `
      <div class="story">
        <div class="day">
          DAY 1
        </div>
        <!-- 플레이어 방 배경 -->
        <img
          src="images/IMG_0210.jpeg"
          class="background-image"
          alt="플레이어의 방"
        >
        <div class="dark-overlay"></div>
        <div class="story-content">
          <div class="image-box">
            <img
              src="images/IMG_0223.jpeg"
              class="scene-image"
              alt="휴대폰 알람 화면"
            >
          </div>
          <div class="dialogue">
            <div class="speaker">
              📱 알람
            </div>
            <p>
              ⏰ 알람이 울리고 있다.
            </p>
            <button
              onclick="wakeUp()"
              class="next"
            >
              알람 끄기
            </button>
          </div>
        </div>
      </div>
    `;
    // 알람 재생
    alarmSound = new Audio("alarm.mp3");
    alarmSound.loop = true;
    alarmSound.volume = 0.7;
    alarmSound.play().catch(function() {
      console.log(
        "브라우저에서 알람 자동 재생이 제한되었습니다."
      );
    });
  }
  // =========================
  // 알람 끄기
  // =========================
  function wakeUp() {
    if (alarmSound) {
      alarmSound.pause();
      alarmSound.currentTime = 0;
      alarmSound = null;
    }
    document.getElementById("app").innerHTML = `
      <div class="story">
        <div class="day">
          DAY 1
        </div>
        <img
          src="images/IMG_0210.jpeg"
          class="background-image"
          alt="플레이어의 방"
        >
        <div class="dark-overlay"></div>
        <div class="story-content">
          <div class="dialogue">
            <div class="speaker">
              나
            </div>
            <p>
              으음…… 몇 시지?
            </p>
            <p>
              ……잠깐.
            </p>
            <p>
              <strong>헉! 늦었다!</strong>
            </p>
            <button
              onclick="nextScene2()"
              class="next"
            >
              NEXT
            </button>
          </div>
        </div>
      </div>
    `;
  }
  // =========================
  // 다빈이에게 전화
  // =========================
  function nextScene2() {
    document.getElementById("app").innerHTML = `
      <div class="story">
        <div class="day">
          DAY 1
        </div>
        <!-- 다빈이에게 전화가 오는 장면 -->
        <img
          src="images/IMG_0225.jpeg"
          class="background-image"
          alt="다빈이에게 전화가 오는 장면"
        >
        <div class="dark-overlay"></div>
        <div class="story-content">
          <div class="image-box">
            <img
              src="images/IMG_0224.jpeg"
              class="scene-image"
              alt="전화 화면"
            >
          </div>
          <div class="dialogue">
            <div class="speaker">
              📱 전화가 왔다
            </div>
            <p>
              띠링— 띠링—
            </p>
            <p>
              다빈이에게 전화가 와 있었다.
            </p>
            <button
              onclick="answerCall()"
              class="next"
            >
              📞 전화 받기
            </button>
          </div>
        </div>
      </div>
    `;
    // 전화벨 재생
    phoneRing = new Audio("phone.mp3");
    phoneRing.loop = true;
    phoneRing.volume = 0.7;
    phoneRing.play().catch(function() {
      console.log(
        "브라우저에서 전화벨 자동 재생이 제한되었습니다."
      );
    });
  }
  // =========================
  // 전화 받기
  // =========================
  function answerCall() {
    if (phoneRing) {
      phoneRing.pause();
      phoneRing.currentTime = 0;
      phoneRing = null;
    }
    document.getElementById("app").innerHTML = `
      <div class="story">
        <div class="day">
          DAY 1
        </div>
        <img
          src="images/IMG_0225.jpeg"
          class="background-image"
          alt="다빈이와 통화하는 장면"
        >
        <div class="dark-overlay"></div>
        <div class="story-content">
          <div class="dialogue">
            <div class="speaker">
              📱 유다빈
            </div>
            <p>
              여보세요?!
            </p>
            <p>
              너 지금 어디야?!
            </p>
            <p>
              설마 아직 집이야?!
            </p>
            <button
              onclick="nextScene3()"
              class="next"
            >
              NEXT
            </button>
          </div>
        </div>
      </div>
    `;
  }
  // =========================
  // 플레이어
  // =========================
  function nextScene3() {
    const playerName =
      localStorage.getItem("playerName");
    document.getElementById("app").innerHTML = `
      <div class="story">
        <div class="day">
          DAY 1
        </div>
        <img
          src="images/IMG_0210.jpeg"
          class="background-image"
          alt="플레이어의 방"
        >
        <div class="dark-overlay"></div>
        <div class="story-content">
          <div class="dialogue">
            <div class="speaker">
              ${playerName}
            </div>
            <p>
              나 지금 나가려고……!
            </p>
            <p>
              먼저 가 있어!
            </p>
            <button
              onclick="nextScene4()"
              class="next"
            >
              NEXT
            </button>
          </div>
        </div>
      </div>
    `;
  }
  // =========================
  // 다빈
  // =========================
  function nextScene4() {
    document.getElementById("app").innerHTML = `
      <div class="story">
        <div class="day">
          DAY 1
        </div>
        <img
          src="images/IMG_0225.jpeg"
          class="background-image"
          alt="다빈이와 통화"
        >
        <div class="dark-overlay"></div>
        <div class="story-content">
          <div class="dialogue">
            <div class="speaker">
              유다빈
            </div>
            <p>
              알았어! 빨리 와!
            </p>
            <p>
              나도 지금 학교 가는 중이야!
            </p>
            <button
              onclick="nextScene5()"
              class="next"
            >
              NEXT
            </button>
          </div>
        </div>
      </div>
    `;
  }
  // =========================
  // 등굣길
  // =========================
  function nextScene5() {
    const playerName =
      localStorage.getItem("playerName");
    document.getElementById("app").innerHTML = `
      <div class="story">
        <div class="day">
          DAY 1
        </div>
        <!-- 등굣길 -->
        <img
          src="images/IMG_0227.jpeg"
          class="background-image"
          alt="등굣길"
        >
        <div class="dark-overlay"></div>
        <div class="story-content">
          <div class="dialogue">
            <div class="speaker">
              ${playerName}
            </div>
            <p>
              전화를 끊고 급하게 집을 나섰다.
            </p>
            <p>
              오늘은 정말 지각이다……
            </p>
            <button
              onclick="nextScene6()"
              class="next"
            >
              NEXT
            </button>
          </div>
        </div>
      </div>
    `;
  }
  // =========================
  // 준호 등장
  // =========================
  function nextScene6() {
    document.getElementById("app").innerHTML = `
      <div class="story">
        <div class="day">
          DAY 1
        </div>
        <!-- 준호 등장 -->
        <img
          src="images/IMG_0197.webp"
          class="background-image"
          alt="준호 등장"
        >
        <div class="dark-overlay"></div>
        <div class="story-content">
          <div class="dialogue">
            <div class="speaker">
              나
            </div>
            <p>
              ……어?
            </p>
            <p>
              저 사람……
            </p>
            <p>
              설마…… 준호?
            </p>
            <button
              onclick="nextScene7()"
              class="next"
            >
              NEXT
            </button>
          </div>
        </div>
      </div>
    `;
  }
  // =========================
  // 다음 장면
  // =========================
  function nextScene7() {
    document.getElementById("app").innerHTML = `
      <div class="story">
        <div class="day">
          DAY 1
        </div>
        <img
          src="images/IMG_0197.webp"
          class="background-image"
          alt="준호"
        >
        <div class="dark-overlay"></div>
        <div class="story-content">
          <div class="dialogue">
            <div class="speaker">
              나
            </div>
            <p>
              자전거를 타고 지나가는 사람을 바라봤다.
            </p>
            <p>
              정말 준호일까……?
            </p>
            <button
              onclick="finishDay1()"
              class="next"
            >
              NEXT
            </button>
          </div>
        </div>
      </div>
    `;
  }
  // =========================
  // DAY 1 종료
  // =========================
  function finishDay1() {
    document.getElementById("app").innerHTML = `
      <div class="content">
        <div class="subtitle">
          DAY 1 COMPLETE
        </div>
        <h2>계속...</h2>
        <p>
          이야기는 이제 막 시작되었다.
        </p>
      </div>
    `;
  }
</script>
</body>
</html>
