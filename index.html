<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX OR NEW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .game {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: auto;
      background: linear-gradient(135deg, #171717, #303030);
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      padding: 40px 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .content {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 4px;
      color: #aaa;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 56px;
      letter-spacing: 6px;
      margin: 0 0 20px;
    }

    h2 {
      font-size: 34px;
      margin: 15px 0 25px;
    }

    h3 {
      font-size: 24px;
      margin-top: 0;
    }

    p {
      line-height: 1.8;
    }

    .description {
      color: #ddd;
      margin-bottom: 35px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 14px 35px;
      margin-top: 18px;
      background: white;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.04);
    }

    input {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 22px;
      margin: 18px 0;
      text-align: left;
    }

    .card p {
      color: #ddd;
      margin: 8px 0;
    }

    /* =========================
       스토리 화면
       ========================= */

    .story {
      min-height: 100vh;
      padding: 25px;
      padding-top: 65px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
    }

    .day {
      position: absolute;
      top: 20px;
      left: 25px;
      font-size: 17px;
      letter-spacing: 3px;
      z-index: 5;
    }

    .background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .dark-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 1;
    }

    .story-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      margin: auto auto 0;
    }

    .image-box {
      text-align: center;
      margin-bottom: 15px;
      position: relative;
      z-index: 2;
    }

    .scene-image {
      width: 100%;
      max-width: 650px;
      max-height: 55vh;
      object-fit: contain;
      border-radius: 14px;
      position: relative;
      z-index: 2;
    }

    .dialogue {
      background: rgba(0,0,0,0.88);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      position: relative;
      z-index: 3;
    }

    .speaker {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .dialogue p {
      margin: 6px 0;
    }

    .next {
      display: block;
      margin-left: auto;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }

      h2 {
        font-size: 29px;
      }

      .scene-image {
        max-height: 45vh;
      }
    }
  </style>
</head>

<body>

<main class="game">

  <div id="app" class="screen">

    <div class="content">

      <div class="subtitle">
        ROMANCE SIMULATION GAME
      </div>

      <h1>EX OR NEW</h1>

      <p class="description">
        다시 시작된 첫사랑, 그리고 새로운 설렘.<br>
        당신의 선택은 누구를 향하게 될까?
      </p>

      <button onclick="startGame()">
        GAME START
      </button>

    </div>

  </div>

</main>

  function startGame() {

    document.getElementById("app").innerHTML = `

      <div class="content">

        <div class="subtitle">
          PLAYER INFORMATION
        </div>

        <h2>플레이어 정보</h2>

        <p>
          게임을 시작하기 전에<br>
          당신의 정보를 입력해주세요.
        </p>

        <input
          id="playerName"
          type="text"
          placeholder="이름"
        >

        <input
          id="playerAge"
          type="number"
          placeholder="나이"
        >

        <input
          id="playerBirth"
          type="date"
        >

        <button onclick="savePlayerInfo()">
          확인
        </button>

      </div>

    `;
  }


  /* =========================
     정보 저장
     ========================= */

  function savePlayerInfo() {

    const name =
      document.getElementById("playerName").value.trim();

    const age =
      document.getElementById("playerAge").value;

    const birth =
      document.getElementById("playerBirth").value;


    if (!name || !age || !birth) {

      alert("이름, 나이, 생년월일을 모두 입력해주세요!");

      return;
    }


    localStorage.setItem("playerName", name);
    localStorage.setItem("playerAge", age);
    localStorage.setItem("playerBirth", birth);


    showRules();
  }
